<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#183e35" />
    <meta
      name="description"
      content="Ridgewise：直接記錄 GPS、保存自己的 GPX、查看路線與上河時間估算。"
    />
    <title>Ridgewise — 我的山行</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23183e35'/%3E%3Cpath d='M8 35 21 13l8 13 4-6 8 15H8Zm9-7 4-7 5 7' fill='none' stroke='%23dcebbf' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css" />
    <link rel="stylesheet" href="./app.bundle.css" />
    <script defer src="./vendor/leaflet/leaflet.js"></script>
    <script defer src="./app.bundle.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要內容</a>
    <div id="app"></div>
    <input
      id="gpx-input"
      type="file"
      accept=".gpx,application/gpx+xml,application/xml,text/xml"
      multiple
      hidden
      aria-label="匯入 GPX，可多選"
    />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog"></dialog>
    <noscript>請開啟 JavaScript，才能使用GPX 路線與登山紀錄功能。</noscript>
  </body>
</html>
